name: Publish

# Publishes the package to npm whenever main carries a package.json version that
# npm does not have yet (spec-sync PRs bump it; manual changes bump it by hand,
# enforced by ci.yml). Authenticates with npm Trusted Publishing (OIDC), so no npm
# token is stored in this repository, and npm attaches provenance automatically.
#
# Trusted Publishing is configured on the package's npm settings page, so the
# package must already exist: the very first version is published manually.
# Until then this workflow skips with a notice instead of failing.

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch: {}

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write # create the vX.Y.Z tag and GitHub release
  id-token: write # npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds

      - name: Check npm for this version
        id: check
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if ! npm view "$NAME" name >/dev/null 2>&1; then
            echo "::notice::$NAME is not on npm yet. Publish the first version manually, then configure Trusted Publishing (see README > Releases)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "$NAME@$VERSION is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: npm ci --ignore-scripts

      - name: Lint
        if: steps.check.outputs.publish == 'true'
        run: npm run lint

      - name: Test
        if: steps.check.outputs.publish == 'true'
        run: npm test

      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: npm run build

      - name: Verify committed dist matches the build
        if: steps.check.outputs.publish == 'true'
        run: git diff --exit-code -- nodes/ dist/

      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public

      # Idempotent: also creates the release for the manually published first
      # version when this workflow is run by hand afterwards.
      - name: Tag and create GitHub release
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.check.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
