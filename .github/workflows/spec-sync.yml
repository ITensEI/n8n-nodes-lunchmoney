name: Spec sync

# Keeps the node in sync with the Lunch Money v2 API spec (@lunch-money/v2-api-spec).
# Runs daily, detects changes against the highest STABLE published version, regenerates
# node code, and opens a PR for review. Never commits to main directly, never auto-merges.

on:
  schedule:
    - cron: '17 6 * * *' # daily, off the hour to avoid GitHub Actions' peak-minute scheduling delays
  workflow_dispatch: {}

concurrency:
  group: spec-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Fetch current spec
        run: node scripts/fetch-spec.js

      - name: Regenerate node code
        run: node scripts/generate-node.js

      - name: Summarize changes
        run: node scripts/summarize-changes.js

      # Pre-filter so a broken regeneration never becomes a PR. ci.yml still runs
      # on the PR this job opens, but because the PR is created with GITHUB_TOKEN,
      # GitHub holds that run until a maintainer clicks "Approve workflows to run".
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (sanity check the generated TypeScript compiles)
        run: npm run build

      - name: Check for changes
        id: changes
        run: |
          # dist/ is committed (and deliberately not ignored) because the
          # documented `npm install github:...` install path has no build
          # step of its own — the compiled output must ship in the repo.
          if git status --porcelain -- lm-endpoints.json .spec-version nodes/ dist/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read spec version
        if: steps.changes.outputs.changed == 'true'
        id: version
        run: echo "value=$(cat .spec-version)" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: spec-sync/${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Remote branch $BRANCH already exists; preserving its review commits."
            exit 0
          fi
          git checkout -b "$BRANCH"
          # Every sync that changes the node ships as a new npm version.
          # summarize-changes.js wrote the semver bump level to .release-type.
          RELEASE_TYPE="$(cat .release-type)"
          OLD_VERSION="$(node -p "require('./package.json').version")"
          npm version "$RELEASE_TYPE" --no-git-tag-version
          NEW_VERSION="$(node -p "require('./package.json').version")"
          printf '### Release\n\nMerging publishes `%s` to npm (%s bump from `%s`).\n' \
            "$NEW_VERSION" "$RELEASE_TYPE" "$OLD_VERSION" >> .pr-body.md
          git add lm-endpoints.json .spec-version nodes/ dist/ package.json package-lock.json
          git commit -m "Sync node with Lunch Money v2 API spec ${{ steps.version.outputs.value }}"
          git push --set-upstream origin "$BRANCH"

      - name: Open or update PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: spec-sync/${{ steps.version.outputs.value }}
        run: |
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --body-file .pr-body.md
          else
            gh pr create \
              --head "$BRANCH" \
              --title "Spec sync: ${{ steps.version.outputs.value }}" \
              --body-file .pr-body.md
          fi
